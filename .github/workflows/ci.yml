name: Flask CI

on:
  push:
    branches:
      - main

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.mitantsoa18 }}
        password: ${{ secrets.narindra18 }}

    - name: Build Docker Image
      run: |
        cd api
        docker build -t mitantsoa18/flask-api:v1 .

    - name: Push Docker Image
      run: docker push mitantsoa18/flask-api:v1